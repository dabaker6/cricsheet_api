# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - app-dev-baker-246-api

on:
  push:
    branches:
      - main

permissions:
  id-token: write 
  contents: read #This is required for actions/checkout
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: v1.${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      ACR_NAME: ${{ secrets.PERSONAL_WEBSITE_ACR_NAME }}
      IMAGE_NAME: ${{ secrets.CRICSHEET_API_IMAGE_NAME }}
      IMAGE_TAG: v1.${{ github.sha }}
      WEBAPP_NAME: ${{ secrets.CRICSHEET_API_NAME }}
      RESOURCE_GROUP: ${{ secrets.PERSONAL_WEBSITE_RG }}
      IMAGE: "${{ secrets.CRICSHEET_API_IMAGE_NAME }}:v1.${{ github.sha }}"    
      
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4  

      - name: Construct image reference
        id: img
        run: echo "ref=${REGISTRY}/${IMAGE_NAME@L}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.img.outputs.ref }}
          labels:
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha, mode=max

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_GITHUB_OIDC }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
                
      - name: Build and push image
        run: |
          az acr login --name $ACR_NAME
          IMAGE="$ACR_NAME.azurecr.io/$IMAGE"
          docker build -t $IMAGE .
          docker push $IMAGE    
      
      - name: Deploy Web App container
        run: |
          IMAGE="$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG"

          az webapp config container set \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP \
            --docker-custom-image-name $IMAGE

      - name: Restart Web App
        run: |
          az webapp restart \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP
