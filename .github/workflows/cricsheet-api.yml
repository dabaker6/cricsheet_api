# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: cricksheet_api - Built and deploy to Azure webapp container 

on:
  push:
    branches:
      - main

permissions:
  id-token: write 
  contents: read #This is required for actions/checkout
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: v1.${{ github.sha }}
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup dotnet ${{ env.DOTNET_VERSION }} environment
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.2.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
      
      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --no-restore      

  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Construct image reference
        id: img
        run: echo "ref=${REGISTRY}/${IMAGE_NAME@L}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.img.outputs.ref }}
          labels:
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha, mode=max

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_GITHUB_OIDC }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Deploy Web App container
        run: |
          az webapp config container set \
            --name ${{ secrets.CRICSHEET_API_NAME }} \
            --resource-group ${{ secrets.PERSONAL_WEBSITE_RG }} \
            --container-image-name "${{ steps.img.outputs.ref }}"

      - name: Restart Web App
        run: |
          az webapp restart \
            --name ${{ secrets.CRICSHEET_API_NAME }} \
            --resource-group ${{ secrets.PERSONAL_WEBSITE_RG }}
