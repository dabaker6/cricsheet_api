# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: cricksheet_api - Built and deploy to Azure webapp container 

on:
  push:
    branches:
      - main
  pull_request:    

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: v1.${{ github.sha }}
  DOTNET_VERSION: '10.0.x'
  CRICSHEET_API_NAME: ${{ secrets.CRICSHEET_API_NAME }}
  WEBAPP_RESOURCEGROUP: ${{ secrets.PERSONAL_WEBSITE_RG }}   

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions: 
      contents: read
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 

      - name: Setup dotnet ${{ env.DOTNET_VERSION }} environment
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.2.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}          
      
      - name: Install dependencies
        run: dotnet restore 

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --no-restore

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      id-token: write 
      contents: read 
      packages: write
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-deploy-${{ github.ref }}
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main'
    steps:    
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 
        
      - name: Construct image reference
        id: img
        run: echo "ref=${REGISTRY}/${IMAGE_NAME@L}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.41

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.img.outputs.ref }}
          labels:
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha, mode=max

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Azure Login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_GITHUB_OIDC }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Deploy Web App container
        run: |
          az webapp config container set \
            --name $CRICSHEET_API_NAME \
            --resource-group $WEBAPP_RESOURCEGROUP \
            --container-image-name "${{ steps.img.outputs.ref }}"

      - name: Restart Web App
        run: |
          az webapp restart \
            --name $CRICSHEET_API_NAME \
            --resource-group $WEBAPP_RESOURCEGROUP
            
      - name: Ensure correct image loaded
        run: |
          configured_image=$(az webapp config show \
            --name $CRICSHEET_API_NAME \
            --resource-group $WEBAPP_RESOURCEGROUP
            --query LinuxFxVersion -o tsv)
          echo "configured image: $configured_image"
          case "$configured_image" in
            *"${{ github.sha }}"*) echo "Image matches commit" ;;
            *) echo "::error:: App uses $configured_image, expected ${{ github.sha }}"; exit 1 ;;
            esac
          
